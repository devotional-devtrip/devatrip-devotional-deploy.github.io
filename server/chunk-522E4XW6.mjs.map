<div class="home-wrapper">
    <div class="home-menu">
        @if(notlogin()){
        <div class="home-menu-item">
            <div class="button" routerLink="/user/dashboard">
                <!--[routerLink]="[{ outlets: { childContainer: ['devotional'] } }]"-->
                <!--routerLink="/devotional" [routerLink]="['', { outlets: { childContainer: ['devotional'] } }]" [routerLink]="['', { outlets: { childContainer: ['devotional'] } }]"  [routerLink]="[{ outlets: { childContainer: ['/devotional'] } }]"-->
                <span>Free Devotional</span>
            </div>
        </div>
        <div class="home-menu-item">
            <div class="button" routerLink="/user/signin" (click)='signIn()'>
                <!--[routerLink]="[{ outlets: { childContainer: ['user', 'signin'] } }]"-->
                <span>Sign In</span>
            </div>
        </div>
        <div class="home-menu-item">
            <div class="button" routerLink="/user/signup">
                <!--[routerLink]="[{ outlets: { childContainer: ['user', 'signup'] } }]"-->
                <span>Sign Up</span>
            </div>
        </div>
        } @else {
        <div class="home-menu-item">
            <div class="button" routerLink="/user/dashboard">
                <span>Dashboard</span>
            </div>
        </div>
        <div class="home-menu-item">
            <div class="button" (click)='signOut()' routerLink="/">
                <span>Sign Out</span>
            </div>
        </div>
        }
    </div>
    <div>
        <!--<router-outlet name="childContainer" [routerOutletData]="{ notlogin: notlogin() }" ></router-outlet>-->
        <home-content [notlogin]="notlogin()" [currentUser]="currentUser()"></home-content>
    </div>
    <div class="home-footer">Powered by Devatrip developers and contributors © devatrip.com 2012-2050</div>
</div>
