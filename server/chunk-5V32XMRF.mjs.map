<div class="eventlist-container">
    @if(isLoading()){
    <div class="loader-container">
        <div class="spinner"></div>
        <p>Loading content, please wait...</p>
    </div>
    } @else {
    <div class="event-items-list">
        @for(item of scheduledEvents; track item) {
        <devotional-schedule-event-item [value]="item"></devotional-schedule-event-item>
        @if(!$last){
        <i class="fa-solid fa-down-long fa-2x py-[2px]"></i>
        <!--<div class="line-container">
            <div class="vertical-arrow-line"></div>
        </div>-->

        <!--<div class="arrow-down-flow">
            <div class="line"></div>
            <span class="arrow-head">&darr;</span>
        </div>-->

        }

        <!--<app-booklistitem [value]="item" (changeHeader)="changeHeaderHandler($event)"></app-booklistitem>-->
        } @empty {
        <p>No event available.</p>
        }
    </div>
    }
    <common-footer></common-footer>
</div>
