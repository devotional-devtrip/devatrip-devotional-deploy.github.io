<!-- audio-player.component.html -->
@if (audioService.currentTrack(); as track) {
<div class="player-card">
    <div class="cover-wrapper">
        <img [src]="track.cover" [alt]="track.title" class="album-cover" [class.spinning]="audioService.isPlaying()" />
    </div>

    <div class="track-details">
        <h2>{{ track.title }}</h2>
        <h3>{{ track.artist }}</h3>
    </div>

    <div class="progress-container">
        <span class="time-stamp">{{ formatTime(audioService.currentTime()) }}</span>
        <input type="range" min="0" max="100" [value]="audioService.progress()" (input)="handleSeek($event)"
            class="progress-bar" /><!--id="customRange"-->
        <span class="time-stamp">{{ formatTime(audioService.duration()) }}</span>
    </div>

    <div class="controls">
        <button class="btn-icon secondary" (click)="audioService.prev()">
            <svg viewBox="0 0 24 24">
                <path d="M6 6h2v12H6zm3.5 6L18 6v12z" />
            </svg>
        </button>

        <button class="btn-icon primary" (click)="audioService.togglePlay()">
            @if (audioService.isPlaying()) {
            <svg viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
            } @else {
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
            }
        </button>

        <button class="btn-icon secondary" (click)="audioService.next()">
            <svg viewBox="0 0 24 24">
                <path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z" />
            </svg>
        </button>
    </div>
</div>
}
